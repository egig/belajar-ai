<!DOCTYPE html>
<html>
	<head>
		<title>AI Chat sederhana</title>
		<link rel="stylesheet" href="style.css" />
	</head>
	<body>
		<main>
			<header>
				<span>AI Chat Sederhana</span>
				<button type="button" id="settings-btn" class="icon-btn" title="Pengaturan" aria-label="Pengaturan">Pengaturan</button>
			</header>
			<div id="messages"></div>
			<form id="chat-form">
				<textarea id="input" placeholder="Tulis pesan..." required></textarea>
				<button type="submit">Kirim</button>
			</form>
			<div id="stats-bar">
				<div id="cost-bar"></div>
				<div id="usage-bar"></div>
			</div>
		</main>

		<div id="settings-modal" class="modal" hidden>
			<div class="modal-box">
				<h2>Pengaturan</h2>
				<label for="system-input">System instruction</label>
				<textarea id="system-input" placeholder="Contoh: Kamu adalah asisten yang menjawab singkat dalam bahasa Indonesia."></textarea>
				<div class="modal-actions">
					<button type="button" id="settings-cancel" class="secondary">Batal</button>
					<button type="button" id="settings-save">Simpan</button>
				</div>
			</div>
		</div>

		<script>
			const form = document.getElementById("chat-form");
			const input = document.getElementById("input");
			const messages = document.getElementById("messages");
			const usageBar = document.getElementById("usage-bar");
			const costBar = document.getElementById("cost-bar");

			const settingsBtn = document.getElementById("settings-btn");
			const settingsModal = document.getElementById("settings-modal");
			const systemInput = document.getElementById("system-input");

			async function openSettings() {
				try {
					const res = await fetch("/api/settings");
					const data = await res.json();
					systemInput.value = data.systemInstruction ?? "";
				} catch (err) {
					console.error(err);
				}
				settingsModal.hidden = false;
				systemInput.focus();
			}

			function closeSettings() {
				settingsModal.hidden = true;
			}

			async function saveSettings() {
				try {
					const res = await fetch("/api/settings", {
						method: "PUT",
						headers: { "Content-Type": "application/json" },
						body: JSON.stringify({ systemInstruction: systemInput.value }),
					});
					if (!res.ok) throw new Error((await res.json()).error);
					closeSettings();
				} catch (err) {
					alert("Gagal menyimpan pengaturan: " + err.message);
				}
			}

			settingsBtn.addEventListener("click", openSettings);
			document.getElementById("settings-cancel").addEventListener("click", closeSettings);
			document.getElementById("settings-save").addEventListener("click", saveSettings);
			settingsModal.addEventListener("click", (e) => {
				if (e.target === settingsModal) closeSettings();
			});
			document.addEventListener("keydown", (e) => {
				if (e.key === "Escape") closeSettings();
			});

			let contextLength = null;
			let modelName = null;

			function addMessage(text, role) {
				const el = document.createElement("div");
				el.className = "message " + role;
				el.textContent = text;
				messages.appendChild(el);
				messages.scrollTop = messages.scrollHeight;
				return el;
			}

			function renderUsage(totalUsage) {
				if (!totalUsage) return;
				const used = totalUsage.total_tokens.toLocaleString();
				const tokenText = contextLength
					? `${used} / ${contextLength.toLocaleString()} token (${((totalUsage.total_tokens / contextLength) * 100).toFixed(1)}%)`
					: `${used} token`;
				usageBar.textContent = modelName ? `${modelName} · ${tokenText}` : tokenText;
			}

			function renderCost(cumulativeUsage) {
				if (!cumulativeUsage) return;
				costBar.textContent = `${cumulativeUsage.total_tokens.toLocaleString()} token terpakai`;
			}

			async function loadModelInfo() {
				try {
					const res = await fetch("/api/model-info");
					const data = await res.json();
					contextLength = data.limits?.contextLength ?? null;
					modelName = data.model ?? null;
				} catch (err) {
					console.error(err);
				}
			}

			async function loadHistory() {
				try {
					const res = await fetch("/api/chat");
					const data = await res.json();
					for (const msg of data.history ?? []) {
						addMessage(msg.content, msg.role);
					}
					renderUsage(data.totalUsage);
					renderCost(data.cumulativeUsage);
				} catch (err) {
					console.error(err);
				}
			}
			loadModelInfo().then(loadHistory);

			form.addEventListener("submit", async (e) => {
				e.preventDefault();
				const message = input.value.trim();
				if (!message) return;

				addMessage(message, "user");
				input.value = "";

				const button = form.querySelector("button");
				button.disabled = true;
				const pending = addMessage("", "assistant");

				try {
					const res = await fetch("/api/chat", {
						method: "POST",
						headers: { "Content-Type": "application/json" },
						body: JSON.stringify({ message }),
					});

					if (!res.ok) {
						const data = await res.json();
						pending.textContent = data.error || "Terjadi kesalahan";
					} else {
						const reader = res.body.getReader();
						const decoder = new TextDecoder();
						while (true) {
							const { done, value } = await reader.read();
							if (done) break;
							pending.textContent += decoder.decode(value, { stream: true });
							messages.scrollTop = messages.scrollHeight;
						}

						const statsRes = await fetch("/api/chat");
						const statsData = await statsRes.json();
						renderUsage(statsData.totalUsage);
						renderCost(statsData.cumulativeUsage);
					}
				} catch (err) {
					pending.textContent = "Gagal terhubung ke server";
				} finally {
					button.disabled = false;
					input.focus();
				}
			});
		</script>
	</body>
</html>
